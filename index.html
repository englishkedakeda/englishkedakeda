<!DOCTYPE html>
<html lang="ar" dir="rtl"><head>
<meta charset="UTF-8">
<meta name="google-site-verification" content="OdC0DGmYuJprPDyPgC4WefDahHAlU-LmR8XhWyipoJU" />

<title>Professor Hussain Gaber | دروس أونلاين في اللغة الإنجليزية</title>
<meta name="description" content="دروس أونلاين في اللغة الإنجليزية للمرحلة الثانوية مع Professor Hussain Gaber (Mr. Hussein Gaber) – English Keda Keda.">
<meta property="og:title" content="Professor Hussain Gaber | دروس أونلاين في اللغة الإنجليزية">
<meta property="og:description" content="دروس أونلاين في اللغة الإنجليزية للمرحلة الثانوية مع Professor Hussain Gaber – English Keda Keda.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://englishkedakeda.github.io/englishkedakeda/">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&amp;family=Cairo:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAF9FF;
    --bg-card:#FFFFFF;
    --ink:#241F3D;
    --ink-soft:#6B6588;
    --primary:#4C3BCF;
    --primary-dark:#372A9E;
    --primary-soft:#ECE9FB;
    --coral:#FF6B4A;
    --coral-soft:#FFEAE3;
    --amber:#F0A400;
    --amber-soft:#FFF3DC;
    --border:#E7E3F5;
    --wa:#25D366;
    --wa-dark:#1DA851;
    --danger:#D64545;
    --shadow: 0 2px 6px rgba(36,31,61,.06), 0 12px 28px rgba(76,59,207,.10);
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --bg:#171331;
      --bg-card:#221C42;
      --ink:#F1EFFB;
      --ink-soft:#B2ACD4;
      --primary:#8B7CF6;
      --primary-dark:#6A59E0;
      --primary-soft:#2C2555;
      --coral:#FF8A6B;
      --coral-soft:#3A2436;
      --amber:#F5BC4C;
      --amber-soft:#3A3120;
      --border:#33285E;
      --danger:#F07171;
      --shadow: 0 2px 6px rgba(0,0,0,.3), 0 14px 32px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"] {
    --bg:#171331;
    --bg-card:#221C42;
    --ink:#F1EFFB;
    --ink-soft:#B2ACD4;
    --primary:#8B7CF6;
    --primary-dark:#6A59E0;
    --primary-soft:#2C2555;
    --coral:#FF8A6B;
    --coral-soft:#3A2436;
    --amber:#F5BC4C;
    --amber-soft:#3A3120;
    --border:#33285E;
    --danger:#F07171;
    --shadow: 0 2px 6px rgba(0,0,0,.3), 0 14px 32px rgba(0,0,0,.4);
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Cairo', system-ui, -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:920px; margin:0 auto; padding:0 20px 100px;}

  /* ---- HERO ---- */
  .hero{
    position:relative;
    overflow:hidden;
    background:linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
    padding:44px 24px 54px;
    margin-bottom:30px;
    border-radius:0 0 28px 28px;
    color:#fff;
  }
  .hero::before{
    content:"";
    position:absolute; top:-60px; right:-60px;
    width:220px; height:220px; border-radius:50%;
    background:rgba(255,255,255,.10);
  }
  .hero::after{
    content:"";
    position:absolute; bottom:-70px; left:-40px;
    width:180px; height:180px; border-radius:50%;
    background:rgba(255,107,74,.22);
  }
  .hero-inner{max-width:920px; margin:0 auto; position:relative; z-index:1; text-align:center;}
  .avatar-ring{
    width:118px; height:118px; border-radius:50%;
    overflow:hidden; margin:0 auto 16px;
    border:4px solid rgba(255,255,255,.85);
    box-shadow:0 10px 26px rgba(0,0,0,.28);
    background:#000;
  }
  .avatar-ring img{width:100%; height:100%; object-fit:cover; display:block;}
  .logo-stamp{
    position:absolute; top:6px; left:6px;
    width:64px; height:64px; border-radius:50%;
    overflow:hidden; z-index:2;
    border:2px solid rgba(255,255,255,.55);
    box-shadow:0 6px 16px rgba(0,0,0,.25);
    background:#e9e4d8;
  }
  .logo-stamp img{width:100%; height:100%; object-fit:cover; object-position:50% 25%; display:block;}
  .badge{margin-left:auto; margin-right:auto;}
  .tagline{margin-left:auto; margin-right:auto;}
  @media (max-width:520px){
    .logo-stamp{width:48px; height:48px; top:4px; left:4px;}
  }
  .badge{
    display:inline-flex; align-items:center; gap:6px;
    background:rgba(255,255,255,.16);
    backdrop-filter:blur(2px);
    padding:6px 14px; border-radius:50px;
    font-size:13px; font-weight:700; margin-bottom:14px;
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:clamp(30px,6.5vw,44px);
    margin:0 0 10px;
    line-height:1.15;
    letter-spacing:-.01em;
  }
  .tagline{color:rgba(255,255,255,.88); font-size:16px; max-width:56ch; line-height:1.6;}
  .share-btn{
    display:inline-flex; align-items:center; gap:6px; margin-top:16px;
    background:rgba(255,255,255,.16); color:#fff; border:1.5px solid rgba(255,255,255,.4);
    border-radius:50px; padding:8px 18px; font-size:13.5px; font-weight:700;
    font-family:'Cairo',sans-serif; cursor:pointer;
  }
  .share-btn:hover{background:rgba(255,255,255,.26);}

  .stage-block{margin-bottom:34px;}
  .stage-head{
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;
    margin-bottom:6px;
  }
  .stage-head h2{
    font-family:'Fraunces', serif; font-weight:700; font-size:22px; margin:0; color:var(--ink);
  }
  .stage-pill{
    color:var(--primary); font-size:13px; font-weight:700;
    background:var(--primary-soft); padding:4px 12px; border-radius:50px;
    white-space:nowrap;
  }
  .updated-note{
    font-size:12.5px; color:var(--ink-soft); font-weight:600;
    margin:0 0 16px; width:100%;
  }
  .video-desc{
    font-size:13.5px; color:var(--ink-soft); line-height:1.6; margin-top:-4px;
  }
  .stage-line{flex:1; height:2px; background:var(--border); border-radius:2px;}

  .grid{display:flex; flex-direction:column; gap:16px;}

  .card{
    background:var(--bg-card);
    border:1px solid var(--border);
    border-top:5px solid var(--primary);
    border-radius:16px;
    padding:20px 20px 18px;
    box-shadow:var(--shadow);
    display:flex; flex-direction:column; gap:13px;
  }
  .card.c1{border-top-color:var(--coral);}
  .card.c2{border-top-color:var(--amber);}

  .card-top{display:flex; align-items:flex-start; gap:13px;}
  .lesson-num{
    font-family:'Fraunces', serif;
    font-size:16px; color:#fff;
    background:var(--primary);
    border-radius:50%;
    width:38px; height:38px;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0; font-weight:700;
    box-shadow:0 3px 8px rgba(76,59,207,.35);
  }
  .card.c1 .lesson-num{background:var(--coral); box-shadow:0 3px 8px rgba(255,107,74,.35);}
  .card.c2 .lesson-num{background:var(--amber); box-shadow:0 3px 8px rgba(240,164,0,.35);}

  .card-title{font-size:18px; font-weight:800; line-height:1.4; padding-top:5px;}
  .status-row{display:flex; align-items:center; gap:8px; font-size:13.5px; color:var(--ink-soft); font-weight:600;}
  .status-row svg{width:15px; height:15px; flex-shrink:0;}
  .status-locked{color:var(--ink-soft);}
  .status-open{color:#1E9E63; font-weight:800;}

  .thumb-wrap{
    position:relative; width:100%; aspect-ratio:16/9; border-radius:12px;
    overflow:hidden; cursor:pointer; background:linear-gradient(135deg, var(--primary-soft), var(--border));
    display:flex; align-items:center; justify-content:center;
  }
  .thumb-wrap img{width:100%; height:100%; object-fit:cover; display:block;}
  .thumb-placeholder{font-size:34px; color:var(--primary); opacity:.5;}
  .thumb-lock{
    position:absolute; inset:0; background:rgba(20,15,40,.38);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
    color:#fff; transition:background .15s ease;
  }
  .thumb-wrap:hover .thumb-lock{background:rgba(20,15,40,.52);}
  .thumb-lock svg{width:26px; height:26px;}
  .thumb-lock span{font-size:12.5px; font-weight:700;}
  .thumb-open-badge{
    position:absolute; top:8px; left:8px; background:#1E9E63; color:#fff;
    font-size:11px; font-weight:800; padding:3px 9px; border-radius:50px;
  }
  .unlock-area{display:none; flex-direction:column; gap:8px;}
  .unlock-area.show{display:flex;}

  .unlock-row{display:flex; gap:8px; flex-wrap:wrap;}
  input.code-input{
    flex:1; min-width:120px;
    border:1.5px solid var(--border);
    background:var(--bg);
    color:var(--ink);
    border-radius:9px;
    padding:11px 12px;
    font-size:15px;
    font-family:'Cairo', sans-serif;
    letter-spacing:.06em;
    text-align:center;
    font-weight:700;
  }
  input.code-input:focus{outline:2px solid var(--primary); outline-offset:1px; border-color:var(--primary);}
  button, select{
    font-family:'Cairo', sans-serif;
    cursor:pointer; border:none; border-radius:9px;
    font-size:14.5px; font-weight:800;
    padding:11px 18px;
    transition:transform .08s ease, opacity .15s ease;
  }
  button:active{transform:scale(.96);}
  .btn-accent{background:var(--primary); color:#fff;}
  .btn-accent:hover{opacity:.9;}
  .btn-ghost{
    background:transparent; color:var(--primary);
    border:1.5px solid var(--primary-soft);
  }
  .btn-ghost:hover{background:var(--primary-soft);}
  .btn-wa{
    background:var(--wa); color:#fff;
    display:inline-flex; align-items:center; gap:7px;
    text-decoration:none; font-weight:800;
  }
  .btn-wa:hover{background:var(--wa-dark);}
  .btn-watch{
    background:linear-gradient(135deg, var(--amber), #FFC94D);
    color:#3A2600;
    display:inline-flex; align-items:center; gap:8px;
    text-decoration:none; width:fit-content;
    font-weight:800;
    box-shadow:0 4px 12px rgba(240,164,0,.35);
  }
  .btn-danger{background:transparent; color:var(--danger); border:1.5px solid var(--danger);}

  .feedback{font-size:13.5px; min-height:18px; font-weight:700;}
  .feedback.err{color:var(--danger);}
  .feedback.ok{color:var(--primary); font-weight:800;}

  .empty{
    text-align:center; padding:54px 20px; color:var(--ink-soft);
    border:2px dashed var(--border); border-radius:16px;
    font-weight:600;
  }

  .wa-float{
    position:fixed; bottom:20px; left:20px;
    background:var(--wa); color:#fff;
    width:58px; height:58px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 8px 22px rgba(37,211,102,.5);
    text-decoration:none; z-index:40;
  }
  .wa-float svg{width:29px; height:29px;}

  /* --- admin --- */
  .admin-toggle{
    position:fixed; top:16px; left:16px; z-index:50;
    background:var(--ink); color:var(--bg);
    border-radius:50px; padding:9px 16px 9px 14px;
    display:none; align-items:center; gap:7px;
    font-size:13.5px; font-weight:800; text-decoration:none;
    box-shadow:var(--shadow);
  }
  .admin-toggle.show{display:inline-flex;}
  .admin-toggle svg{width:15px; height:15px;}

  .overlay{
    position:fixed; inset:0; background:rgba(23,17,45,.6);
    z-index:60; display:none; align-items:flex-start; justify-content:center;
    padding:40px 14px; overflow-y:auto;
  }
  .overlay.open{display:flex;}
  .panel{
    background:var(--bg-card); border-radius:18px;
    max-width:640px; width:100%;
    padding:26px 22px 28px;
    box-shadow:0 24px 70px rgba(0,0,0,.4);
    border-top:5px solid var(--primary);
  }
  .panel-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;}
  .panel-head h3{font-family:'Fraunces',serif; font-size:21px; margin:0; font-weight:700;}
  .close-btn{background:none; border:none; font-size:22px; color:var(--ink-soft); cursor:pointer; line-height:1; padding:4px;}

  .field{margin-bottom:14px;}
  .field label{display:block; font-size:13px; font-weight:800; color:var(--ink-soft); margin-bottom:5px;}
  .field input, .field select{
    width:100%; border:1.5px solid var(--border); background:var(--bg);
    color:var(--ink); border-radius:9px; padding:11px 12px; font-size:14.5px;
    font-family:'Cairo',sans-serif; font-weight:600;
  }
  .field input:focus, .field select:focus{outline:2px solid var(--primary); outline-offset:1px;}
  hr.sep{border:none; border-top:1px solid var(--border); margin:22px 0;}

  .stage-row{
    display:flex; gap:8px; align-items:center; margin-bottom:10px;
  }
  .stage-row input{
    flex:1; border:1.5px solid var(--border); background:var(--bg);
    color:var(--ink); border-radius:9px; padding:10px 12px; font-size:14px;
    font-family:'Cairo',sans-serif; font-weight:700;
  }
  .stage-row input:focus{outline:2px solid var(--primary); outline-offset:1px;}
  .stage-row button{padding:8px 12px; font-size:12.5px; flex-shrink:0;}

  .admin-stage-group{margin-bottom:16px;}
  .admin-stage-group .grp-title{
    font-size:13px; font-weight:800; color:var(--primary);
    margin-bottom:8px; padding-bottom:4px; border-bottom:1.5px dashed var(--border);
  }

  .admin-video{
    border:1px solid var(--border); border-radius:12px; padding:13px 15px;
    display:flex; flex-direction:column; gap:8px; margin-bottom:11px;
    background:var(--bg);
  }
  .admin-video .row1{display:flex; justify-content:space-between; gap:10px; align-items:flex-start;}
  .admin-video .title{font-weight:800; font-size:14.5px;}
  .admin-video .code-box{
    font-family:'Cairo',sans-serif; letter-spacing:.12em; font-weight:800;
    background:var(--primary-soft); color:var(--primary);
    border-radius:8px; padding:6px 10px; font-size:16px; display:inline-block;
    cursor:pointer;
  }
  .admin-video .actions{display:flex; gap:6px; flex-wrap:wrap;}
  .edit-form{
    display:none; flex-direction:column; gap:8px; margin-top:10px;
    padding-top:10px; border-top:1.5px dashed var(--border);
  }
  .edit-form.show{display:flex;}
  .edit-form input[type="text"], .edit-form input[type="url"]{
    width:100%; border:1.5px solid var(--border); background:var(--bg-card);
    color:var(--ink); border-radius:8px; padding:8px 10px; font-size:13.5px;
    font-family:'Cairo',sans-serif;
  }
  .edit-form label{font-size:11.5px; font-weight:800; color:var(--ink-soft); margin-bottom:-4px;}
  .edit-thumb-preview{width:80px; height:45px; object-fit:cover; border-radius:6px; display:none;}
  .edit-form .actions{margin-top:2px;}
  .admin-video .actions button{padding:7px 11px; font-size:12.5px;}

  .code-chips{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px;}
  .code-chip{
    display:inline-flex; align-items:center; gap:6px;
    background:var(--primary-soft); border-radius:8px; padding:5px 6px 5px 10px;
  }
  .code-chip-text{
    font-family:'Cairo',sans-serif; letter-spacing:.1em; font-weight:800;
    color:var(--primary); font-size:14px; cursor:pointer;
  }
  .code-chip-label{font-size:11.5px; color:var(--ink-soft); font-weight:700; border-right:1px solid var(--border); padding-right:6px;}
  .chip-x{
    background:transparent; border:none; color:var(--danger); font-size:13px;
    padding:2px 4px; cursor:pointer; font-weight:800; border-radius:5px;
  }
  .chip-x:hover{background:var(--coral-soft);}
  .add-code-row{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px;}
  .add-code-row .label-input{
    flex:1; min-width:120px; border:1.5px solid var(--border); background:var(--bg-card);
    color:var(--ink); border-radius:8px; padding:8px 10px; font-size:13px;
    font-family:'Cairo',sans-serif;
  }
  .add-code-row button{padding:8px 12px; font-size:12.5px; white-space:nowrap;}

  .publish-bar{
    position:sticky; bottom:-28px; margin-top:22px;
    background:var(--bg-card); padding-top:14px;
  }
  .publish-btn{
    width:100%; padding:15px; font-size:15.5px;
    background:linear-gradient(135deg, var(--coral), #FF8A6B);
    color:#fff; box-shadow:0 6px 18px rgba(255,107,74,.35);
  }
  .publish-status{font-size:12.5px; text-align:center; margin-top:8px; color:var(--ink-soft); min-height:16px; font-weight:700;}

  .hint{font-size:12.5px; color:var(--ink-soft); margin-top:-6px; margin-bottom:12px;}

  /* --- streak badge --- */
  .streak-badge{
    display:inline-flex; align-items:center; gap:6px;
    background:rgba(255,255,255,.16); padding:5px 13px; border-radius:50px;
    font-size:12.5px; font-weight:800; margin-top:10px;
  }

  /* --- word of the day --- */
  .wotd{
    max-width:920px; margin:0 auto 30px; padding:0 20px;
  }
  .wotd-card{
    background:linear-gradient(120deg, var(--amber-soft), var(--bg-card));
    border:1.5px solid var(--border); border-radius:16px;
    padding:18px 20px; box-shadow:var(--shadow);
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  }
  .wotd-icon{
    width:44px; height:44px; border-radius:12px; flex-shrink:0;
    background:var(--amber); color:#fff; font-size:20px;
    display:flex; align-items:center; justify-content:center;
  }
  .wotd-body{flex:1; min-width:180px;}
  .wotd-label{font-size:11.5px; font-weight:800; color:var(--amber); text-transform:uppercase; letter-spacing:.04em;}
  .wotd-word{font-family:'Fraunces',serif; font-weight:700; font-size:19px; color:var(--ink); margin:2px 0;}
  .wotd-word span{color:var(--ink-soft); font-weight:600; font-size:14px; font-family:'Cairo',sans-serif;}
  .wotd-ex{font-size:13px; color:var(--ink-soft); font-style:italic;}

  /* --- progress bar --- */
  .progress-wrap{margin:2px 0 16px; width:100%;}
  .progress-label{display:flex; justify-content:space-between; font-size:12px; color:var(--ink-soft); font-weight:700; margin-bottom:5px;}
  .progress-track{height:8px; background:var(--primary-soft); border-radius:6px; overflow:hidden;}
  .progress-fill{height:100%; background:linear-gradient(90deg, var(--primary), var(--coral)); border-radius:6px; transition:width .4s ease;}

  /* --- certificate --- */
  .cert-btn{
    display:inline-flex; align-items:center; gap:8px;
    background:linear-gradient(135deg, var(--amber), #FFC94D); color:#3A2600;
    border:none; border-radius:10px; padding:11px 18px; font-weight:800; font-size:14px;
    font-family:'Cairo',sans-serif; cursor:pointer; margin-top:4px;
    box-shadow:0 6px 16px rgba(240,164,0,.3);
  }
  .cert-overlay{
    position:fixed; inset:0; background:rgba(23,17,45,.65); z-index:70;
    display:none; align-items:center; justify-content:center; padding:20px;
  }
  .cert-overlay.open{display:flex;}
  .cert-box{
    background:#fff; color:#241F3D; width:100%; max-width:560px;
    border-radius:14px; padding:36px 30px; text-align:center; position:relative;
    border:10px solid var(--primary); box-shadow:0 30px 80px rgba(0,0,0,.4);
  }
  .cert-close{position:absolute; top:10px; left:10px; background:none; border:none; font-size:22px; cursor:pointer; color:#999;}
  .cert-seal{font-size:34px; margin-bottom:6px;}
  .cert-title{font-family:'Fraunces',serif; font-weight:700; font-size:22px; margin:6px 0 2px; color:var(--primary);}
  .cert-sub{font-size:12.5px; color:#888; margin-bottom:18px;}
  .cert-name{font-family:'Fraunces',serif; font-size:28px; font-weight:700; margin:10px 0; border-bottom:2px solid var(--primary-soft); display:inline-block; padding-bottom:6px;}
  .cert-stage{font-size:15px; color:#555; margin-bottom:4px;}
  .cert-date{font-size:12.5px; color:#999; margin-bottom:20px;}
  .cert-nameinput{
    width:100%; border:1.5px solid var(--border); border-radius:9px; padding:10px 12px;
    font-size:14.5px; font-family:'Cairo',sans-serif; margin-bottom:14px; text-align:center;
  }
  .cert-actions{display:flex; gap:8px; justify-content:center; flex-wrap:wrap;}
  @media print{
    body *{visibility:hidden;}
    .cert-box, .cert-box *{visibility:visible;}
    .cert-box{position:fixed; inset:0; margin:auto; border-width:14px;}
    .cert-close, .cert-actions{display:none !important;}
  }

  /* --- referral --- */
  .referral-card{
    max-width:920px; margin:0 auto 30px; padding:0 20px;
  }
  .referral-inner{
    background:linear-gradient(120deg, var(--primary-soft), var(--bg-card));
    border:1.5px solid var(--border); border-radius:16px;
    padding:20px; box-shadow:var(--shadow);
    display:flex; align-items:center; gap:16px; flex-wrap:wrap;
  }
  .referral-text{flex:1; min-width:180px;}
  .referral-text strong{display:block; font-family:'Fraunces',serif; font-size:16.5px; margin-bottom:3px; color:var(--ink);}
  .referral-text span{font-size:13px; color:var(--ink-soft);}
  .referral-btn{
    background:var(--primary); color:#fff; border:none; border-radius:10px;
    padding:11px 18px; font-weight:800; font-size:14px; font-family:'Cairo',sans-serif;
    cursor:pointer; white-space:nowrap;
  }
</style>
</head>

  function waLink(number, text){
    var n = (number||'').replace(/[^0-9]/g,'');
    if(!n) return null;
    return 'https://wa.me/' + n + (text ? ('?text=' + encodeURIComponent(text)) : '');
  }

  function unlockedKey(id){ return 'unlocked_video_' + id; }
  function stageLabel(s, idx){ return (s.name && s.name.trim()) ? s.name.trim() : ('ليست بدون اسم ' + (idx+1)); }
  function formatDate(iso){
    if(!iso) return '';
    var d = new Date(iso);
    if(isNaN(d.getTime())) return '';
    var months = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
    return d.getDate() + ' ' + months[d.getMonth()] + ' ' + d.getFullYear();
  }

  /* ---------------- WORD OF THE DAY ---------------- */
  var WORD_BANK = [
    {w:'Achieve', ar:'يحقق / ينجز', ex:'She worked hard to achieve her goals.'},
    {w:'Ambitious', ar:'طموح', ex:'He is an ambitious young student.'},
    {w:'Brilliant', ar:'رائع / لامع', ex:'That was a brilliant idea.'},
    {w:'Confident', ar:'واثق', ex:'Practice makes you more confident.'},
    {w:'Determined', ar:'مصمم', ex:'She is determined to pass the exam.'},
    {w:'Effort', ar:'مجهود', ex:'Put more effort into your homework.'},
    {w:'Fluent', ar:'طليق / بطلاقة', ex:'He speaks fluent English now.'},
    {w:'Grateful', ar:'ممتن', ex:'I am grateful for your help.'},
    {w:'Improve', ar:'يحسّن / يتحسن', ex:'Reading daily will improve your vocabulary.'},
    {w:'Knowledge', ar:'معرفة', ex:'Knowledge is power.'},
    {w:'Motivation', ar:'حافز / دافع', ex:'Good grades boost your motivation.'},
    {w:'Opportunity', ar:'فرصة', ex:'This course is a great opportunity.'},
    {w:'Patience', ar:'صبر', ex:'Learning a language needs patience.'},
    {w:'Progress', ar:'تقدم', ex:'You are making great progress.'},
    {w:'Review', ar:'يراجع', ex:'Review the lesson before the test.'},
    {w:'Skill', ar:'مهارة', ex:'Speaking is an important skill.'},
    {w:'Understand', ar:'يفهم', ex:'Do you understand the grammar rule?'},
    {w:'Vocabulary', ar:'مفردات', ex:'Learn five new vocabulary words daily.'},
    {w:'Focus', ar:'يركز', ex:'Try to focus during the lesson.'},
    {w:'Practice', ar:'يتدرب / تدريب', ex:'Practice makes perfect.'}
  ];
  function dayOfYear(d){
    var start = new Date(d.getFullYear(), 0, 0);
    var diff = d - start;
    return Math.floor(diff / 86400000);
  }
  function renderWordOfDay(){
    var wrap = document.getElementById('wotdWrap');
    if(!wrap) return;
    var idx = dayOfYear(new Date()) % WORD_BANK.length;
    var item = WORD_BANK[idx];
    wrap.innerHTML =
      '<div class="wotd-card">' +
        '<div class="wotd-icon">💡</div>' +
        '<div class="wotd-body">' +
          '<div class="wotd-label">كلمة اليوم</div>' +
          '<div class="wotd-word">' + item.w + ' <span>' + item.ar + '</span></div>' +
          '<div class="wotd-ex">' + item.ex + '</div>' +
        '</div>' +
      '</div>';
  }

  /* ---------------- STREAK COUNTER ---------------- */
  function updateStreak(){
    var wrap = document.getElementById('streakBadgeWrap');
    if(!wrap) return;
    var todayStr = new Date().toISOString().slice(0,10);
    var last = null, streak = 0;
    try{
      last = localStorage.getItem('streak_last_visit');
      streak = parseInt(localStorage.getItem('streak_count') || '0', 10);
    }catch(e){}

    if(last === todayStr){
      // already counted today, keep as-is
    } else {
      var y = new Date();
      y.setDate(y.getDate()-1);
      var yStr = y.toISOString().slice(0,10);
      if(last === yStr){ streak = streak + 1; }
      else { streak = 1; }
      try{
        localStorage.setItem('streak_last_visit', todayStr);
        localStorage.setItem('streak_count', String(streak));
      }catch(e){}
    }

    if(streak >= 1){
      wrap.innerHTML = '<div class="streak-badge">🔥 ' + streak + (streak===1 ? ' يوم' : ' أيام') + ' متتالية</div>';
    }
  }

  /* ---------------- REFERRAL ---------------- */
  var referBtnEl = document.getElementById('referBtn');
  if(referBtnEl){
    referBtnEl.addEventListener('click', function(){
      var name = '';
      try{ name = localStorage.getItem('referrer_name') || ''; }catch(e){}
      if(!name){
        name = prompt('اكتب اسمك عشان صاحبك يقول إنك اللي رشحته:') || '';
        if(name){ try{ localStorage.setItem('referrer_name', name); }catch(e){} }
      }
      var url = SITE_URL;
      var msg = name
        ? ('جرب دروس ' + (DATA.siteTitle||'') + '! ' + url + ' — قول إن ' + name + ' رشحلك تاخد خصم 🎁')
        : ('جرب دروس ' + (DATA.siteTitle||'') + '! ' + url);
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(msg).then(function(){
          var old = referBtnEl.textContent;
          referBtnEl.textContent = 'اتنسخت الرسالة! ✅';
          setTimeout(function(){ referBtnEl.textContent = old; }, 1800);
        }).catch(function(){
          referBtnEl.textContent = msg;
          setTimeout(function(){ referBtnEl.textContent = 'رشح دلوقتي'; }, 4000);
        });
      } else {
        referBtnEl.textContent = msg;
        setTimeout(function(){ referBtnEl.textContent = 'رشح دلوقتي'; }, 4000);
      }
    });
  }

  /* ---------------- CERTIFICATE ---------------- */
  var certStageId = null;
  function openCertificate(stageId, stageName){
    certStageId = stageId;
    document.getElementById('certStageName').textContent = stageName;
    document.getElementById('certDate').textContent = formatDate(new Date().toISOString());
    var savedName = '';
    try{ savedName = localStorage.getItem('student_name') || ''; }catch(e){}
    document.getElementById('certNameInput').value = savedName;
    document.getElementById('certNameDisplay').textContent = savedName || 'اسم الطالب';
    document.getElementById('certOverlay').classList.add('open');
  }
  document.getElementById('certNameInput').addEventListener('input', function(e){
    var v = e.target.value.trim();
    document.getElementById('certNameDisplay').textContent = v || 'اسم الطالب';
    try{ localStorage.setItem('student_name', v); }catch(err){}
  });
  document.getElementById('certClose').addEventListener('click', function(){
    document.getElementById('certOverlay').classList.remove('open');
  });
  document.getElementById('certOverlay').addEventListener('click', function(e){
    if(e.target.id === 'certOverlay'){ document.getElementById('certOverlay').classList.remove('open'); }
  });
  document.getElementById('certPrintBtn').addEventListener('click', function(){
    window.print();
  });

  var shareBtnEl = document.getElementById('shareBtn');
  if(shareBtnEl){
    shareBtnEl.addEventListener('click', function(){
      var url = SITE_URL;

      function showCopied(){
        var old = shareBtnEl.getAttribute('data-original') || shareBtnEl.textContent;
        shareBtnEl.setAttribute('data-original', old);
        shareBtnEl.textContent = 'اتنسخ اللينك! ✅';
        setTimeout(function(){ shareBtnEl.textContent = old; }, 1800);
      }

      function legacyCopy(){
        var ok = false;
        try{
          var ta = document.createElement('textarea');
          ta.value = url;
          ta.style.position = 'fixed';
          ta.style.top = '-1000px';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.focus();
          ta.select();
          ok = document.execCommand('copy');
          document.body.removeChild(ta);
        }catch(e){ ok = false; }
        if(ok){ showCopied(); }
        else { showLinkFallback(); }
      }

      function showLinkFallback(){
        var old = shareBtnEl.getAttribute('data-original') || shareBtnEl.textContent;
        shareBtnEl.setAttribute('data-original', old);
        shareBtnEl.textContent = url;
        setTimeout(function(){ shareBtnEl.textContent = old; }, 4000);
      }

      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(url).then(showCopied).catch(legacyCopy);
      } else {
        legacyCopy();
      }
    });
  }

  /* ---------------- PUBLIC RENDER ---------------- */
  function renderPublic(){
    document.getElementById('siteTitle').textContent = DATA.siteTitle || 'دروسي أونلاين';
    document.getElementById('siteTagline').textContent = DATA.tagline || '';
    document.title = (DATA.siteTitle || 'دروسي أونلاين') + ' | دروس أونلاين في اللغة الإنجليزية';

    var wa = waLink(DATA.whatsapp, 'السلام عليكم، عايز أشترك وأجيب كود درس');
    var waFloat = document.getElementById('waFloat');
    if(wa){ waFloat.href = wa; waFloat.style.display='flex'; }
    else { waFloat.style.display='none'; }

    var container = document.getElementById('stagesContainer');
    var empty = document.getElementById('emptyState');
    container.innerHTML = '';

    var stages = DATA.stages || [];
    var totalVideos = stages.reduce(function(sum, s){ return sum + ((s.videos||[]).length); }, 0);

    if(!totalVideos){
      empty.style.display = 'block';
      return;
    }
    empty.style.display = 'none';

    var colorClasses = ['', 'c1', 'c2'];
    var globalIdx = 0;

    stages.forEach(function(stage, sIdx){
      var videos = stage.videos || [];
      if(!videos.length) return;

      var block = document.createElement('div');
      block.className = 'stage-block';

      var paidVideos = videos.filter(function(v){ return !v.free; });
      var unlockedCount = 0;
      paidVideos.forEach(function(v){
        try{ if(localStorage.getItem(unlockedKey(v.id)) === '1'){ unlockedCount++; } }catch(e){}
      });
      var pct = paidVideos.length ? Math.round((unlockedCount / paidVideos.length) * 100) : 0;
      var thisStageLabel = stageLabel(stage, sIdx);

      var updatedTxt = formatDate(stage.updatedAt);
      var headHtml = '<div class="stage-head">' +
        '<h2>' + escapeHtml(thisStageLabel) + '</h2>' +
        '<span class="stage-line"></span>' +
        '<span class="stage-pill">' + videos.length + ' درس</span>' +
        '</div>' +
        (updatedTxt ? '<div class="updated-note">🕓 آخر تحديث: ' + updatedTxt + '</div>' : '') +
        (paidVideos.length ? ('<div class="progress-wrap">' +
          '<div class="progress-label"><span>نسبة الإنجاز</span><span>' + unlockedCount + ' / ' + paidVideos.length + ' (' + pct + '%)</span></div>' +
          '<div class="progress-track"><div class="progress-fill" style="width:' + pct + '%"></div></div>' +
        '</div>') : '') +
        (paidVideos.length && pct === 100 ? '<button class="cert-btn" data-act="cert" data-sid="' + stage.id + '" data-sname="' + escapeHtml(thisStageLabel) + '">🏆 احصل على شهادة الإتمام</button>' : '');

      var gridHtml = '<div class="grid"></div>';
      block.innerHTML = headHtml + gridHtml;
      var grid = block.querySelector('.grid');

      videos.forEach(function(v){
        var isFree = !!v.free;
        var isUnlocked = isFree;
        if(!isFree){ try{ isUnlocked = localStorage.getItem(unlockedKey(v.id)) === '1'; }catch(e){} }

        var card = document.createElement('div');
        card.className = 'card ' + colorClasses[globalIdx % 3];
        globalIdx++;

        var lockedIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>';
        var openIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg>';

        var waMsg = 'السلام عليكم، عايز كود درس: ' + v.title;
        var waHref = waLink(DATA.whatsapp, waMsg);

        var html = '';

        html += '<div class="thumb-wrap" data-action="' + (isUnlocked ? 'none' : 'reveal') + '" data-vid="' + v.id + '">';
        if(v.thumb){ html += '<img src="' + v.thumb + '" alt="">'; }
        else { html += '<div class="thumb-placeholder">🎬</div>'; }
        if(isUnlocked){
          html += '<div class="thumb-open-badge">' + (isFree ? '🎁 مجاني' : '✔ متاح') + '</div>';
        } else {
          html += '<div class="thumb-lock">' + lockedIcon + '<span>دوس عشان تدخل الكود</span></div>';
        }
        html += '</div>';

        html += '<div class="card-top">';
        html += '<div class="lesson-num">' + globalIdx + '</div>';
        html += '<div class="card-title">' + escapeHtml(v.title) + '</div>';
        html += '</div>';
        if(v.desc){ html += '<div class="video-desc">' + escapeHtml(v.desc) + '</div>'; }

        if(isUnlocked){
          html += '<div class="status-row status-open">' + openIcon + '<span>' + (isFree ? 'درس مجاني — شاهده الآن' : 'متاح للمشاهدة') + '</span></div>';
          html += '<a class="btn-watch" href="' + escapeHtml(v.url) + '" target="_blank" rel="noopener">▶ مشاهدة الفيديو</a>';
        } else {
          html += '<div class="status-row status-locked">' + lockedIcon + '<span>مقفول - محتاج كود</span></div>';
          html += '<div class="unlock-area" id="unlock-area-' + v.id + '">';
          html += '<div class="unlock-row">';
          html += '<input type="text" class="code-input" placeholder="اكتب الكود هنا" data-vid="' + v.id + '" maxlength="8">';
          html += '<button class="btn-accent" data-action="unlock" data-vid="' + v.id + '">فتح</button>';
          if(waHref){ html += '<a class="btn-wa" href="' + waHref + '" target="_blank" rel="noopener">واتساب</a>'; }
          html += '</div>';
          html += '<div class="feedback" id="fb-' + v.id + '"></div>';
          html += '</div>';
        }

        card.innerHTML = html;
        grid.appendChild(card);
      });

      container.appendChild(block);
    });

    container.querySelectorAll('[data-act="cert"]').forEach(function(btn){
      btn.addEventListener('click', function(){
        openCertificate(btn.getAttribute('data-sid'), btn.getAttribute('data-sname'));
      });
    });

    // wire thumbnail click to reveal code entry
    container.querySelectorAll('.thumb-wrap[data-action="reveal"]').forEach(function(thumb){
      thumb.addEventListener('click', function(){
        var vid = thumb.getAttribute('data-vid');
        var area = document.getElementById('unlock-area-' + vid);
        if(area){
          area.classList.toggle('show');
          if(area.classList.contains('show')){
            var inp = area.querySelector('input.code-input');
            if(inp){ inp.focus(); }
          }
        }
      });
    });

    // wire unlock buttons
    container.querySelectorAll('[data-action="unlock"]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var vid = btn.getAttribute('data-vid');
        var input = container.querySelector('input[data-vid="'+vid+'"]');
        var fb = document.getElementById('fb-'+vid);
        var entered = (input.value||'').trim().toUpperCase();
        var video = null;
        (DATA.stages||[]).forEach(function(s){
          (s.videos||[]).forEach(function(x){ if(x.id === vid) video = x; });
        });
        if(!video){ return; }
        var codes = video.codes || [];
        var match = codes.some(function(c){ return entered && entered === (c.code||'').toUpperCase(); });
        if(match){
          try{ localStorage.setItem(unlockedKey(vid), '1'); }catch(e){}
          renderPublic();
        } else {
          fb.textContent = 'الكود غير صحيح، تأكد منه أو تواصل واتساب';
          fb.className = 'feedback err';
        }
      });
    });
    container.querySelectorAll('input.code-input').forEach(function(inp){
      inp.addEventListener('keydown', function(e){
        if(e.key === 'Enter'){
          container.querySelector('[data-action="unlock"][data-vid="'+inp.getAttribute('data-vid')+'"]').click();
        }
      });
    });
  }


  renderPublic();
  renderWordOfDay();
  updateStreak();
})();</script>
</body></html>
